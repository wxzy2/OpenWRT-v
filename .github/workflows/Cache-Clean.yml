name: Cache-Clean

on:
  # 自动清理：每周一北京时间 04:00
  # schedule:
  #   - cron: '0 20 * * 0'

  # 手动清理
  workflow_dispatch:

permissions:
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Cache Clean
        run: |
          echo "开始清理 GitHub Actions Cache..."
          gh cache delete --all || true
          echo "Cache 清理完成"
